name = "oshi"
main = "worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Local dev bindings (used by wrangler dev / npm run dev:worker)
# Secrets: create .dev.vars with MERCHANT_SECRET=your-local-secret
[[d1_databases]]
binding = "DB"
database_name = "oshi-db"
database_id = "PLACEHOLDER_REPLACE_AFTER_D1_CREATE"

[[r2_buckets]]
binding = "R2"
bucket_name = "oshi-files"

# ── Beta environment ──────────────────────────────────────────────────────────
# Deployed automatically on every push to main.
# Worker secrets: wrangler secret put MERCHANT_SECRET --env beta
[env.beta]
name = "oshi-beta"

[[env.beta.d1_databases]]
binding = "DB"
database_name = "oshi-beta-db"
database_id = "e90d19db-69ad-4fad-bebe-8ece584de298"

[[env.beta.r2_buckets]]
binding = "R2"
bucket_name = "oshi-beta-files"

# ── Production environment ────────────────────────────────────────────────────
# Deployed manually via GitHub Actions workflow_dispatch.
# Worker secrets: wrangler secret put MERCHANT_SECRET --env production
[env.production]
name = "oshi-production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "oshi-production-db"
database_id = "d5648298-548e-4960-9af0-3069a0dfdaa7"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "oshi-production-files"
